# train_config_seedheads_baseline.yaml

# ---- model & run metadata ----
model: 
train_yaml:
project:
name:
exist_ok: false

# ---- training schedule ----
epochs: 60
patience: 40
imgsz: 2560
batch: 4
device: "2"
workers: 8
max_det: 2000

# ---- optimizer & LR ----
optimizer: AdamW
lr0: 0.0005
lrf: 0.05
cos_lr: true
warmup_epochs: 2.0
momentum: 0.937
weight_decay: 0.0005
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ---- data usage / labels ----
classes: null
single_cls: true
fraction: 1.0

# ---- training behavior ----
rect: false
cache: false
pretrained: true
freeze: 0
close_mosaic: 20
multi_scale: false
deterministic: false
seed: 0
resume: false
save: true
save_period: -1
val: true
plots: true
amp: true

# ---- loss gains ----
box: 7.5
cls: 0.3
dfl: 1.5
augments:
  # ---- augmentations ----
  hsv_h: 0.01
  hsv_s: 0.25
  hsv_v: 0.2
  bgr: 0.0

  degrees: 2.0
  translate: 0.04
  scale: 0.15
  shear: 0.0
  perspective: 0.0

  flipud: 0.0
  fliplr: 0.5

  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  erasing: 0.0
  auto_augment: null
