# train_config_seedheads_baseline.yaml

# ---- model & run metadata ----
model:
train_yaml:
project:
name:
exist_ok: false

# ---- training schedule ----
epochs: 200
patience: 30
imgsz: 2560
batch: 4
device: "2"
workers: 8
max_det: 2000

# ---- optimizer & LR ----
optimizer: AdamW
lr0: 0.0015
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
cos_lr: true
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ---- data usage / labels ----
classes: null
single_cls: true
fraction: 1.0

# ---- training behavior ----
rect: false
cache: false
pretrained: true
freeze: 0
close_mosaic: 50
multi_scale: false
deterministic: false
seed: 0
resume: false
save: true
save_period: -1
val: true
plots: true
amp: true

# ---- loss gains ----
box: 7.5
cls: 0.3
dfl: 1.5
augments:
  # ---- augmentations ----
  hsv_h: 0.015
  hsv_s: 0.45
  hsv_v: 0.35
  bgr: 0.0

  degrees: 5.0
  translate: 0.06
  scale: 0.25
  shear: 1.0
  perspective: 0.0001

  flipud: 0.0
  fliplr: 0.5

  mosaic: 0.35
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  auto_augment: null
  erasing: 0.0